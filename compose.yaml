services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: foodscan
      POSTGRES_USER: foodscan
      POSTGRES_PASSWORD: foodscan_dev
    ports:
      - "5432:5432"
    volumes:
      - foodscan_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodscan -d foodscan"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  foodscan_postgres_data:
